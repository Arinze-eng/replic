name: wormgpt_agent
description: "WormGPT Agent — autonomous sandbox-synced AI on Android."
publish_to: 'none'
version: 1.5.4+72

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.2
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.2
  uuid: ^4.5.1
  flutter_markdown: ^0.7.4
  flutter_math_fork: 0.7.3
  path_provider: ^2.1.4
  archive: ^4.0.7
  open_filex: ^4.5.0
  share_plus: ^10.0.0
  webview_flutter: ^4.10.0
  # 🌐 Stealth Browser engine — far more powerful than webview_flutter:
  # CookieManager, JS injection at document-start (for fingerprint/geo spoofing),
  # download interception, find-in-page, WebRTC control, custom user-agent, etc.
  # Uses the OS WebView engine so it adds only a few MB to the APK.
  flutter_inappwebview: ^6.1.5
  device_info_plus: ^10.1.2
  intl: ^0.19.0
  image_picker: ^1.1.2
  file_picker: ^8.1.2
  url_launcher: ^6.3.0
  # 🎧 WormGPT Ultra music engine — same native ExoPlayer/media3 backend Spotui
  # uses, exposed through just_audio, plus a background media session so music
  # keeps playing (and shows on the lock screen) when the app is backgrounded.
  just_audio: ^0.9.42
  just_audio_background: ^0.0.1-beta.13

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/linux/alpine-minirootfs-3.20.3-aarch64.tgz
