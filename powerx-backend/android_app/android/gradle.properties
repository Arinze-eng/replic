org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
org.gradle.daemon=false
org.gradle.parallel=false
org.gradle.caching=true
android.useAndroidX=true
android.enableJetifier=true

# ── Dexing / core-library desugaring workaround ─────────────────────────────
# With compileSdk 35 + AGP 8.7 + core-library desugaring enabled, the per-library
# DexingNoClasspathTransform (used because needsClasspath=false) crashes with:
#   D8: java.lang.IllegalStateException: The given file '.../android-35/android.jar'
#   is located outside the root directory '.../bundleLibRuntimeToDirRelease'
# in :app:mergeDexRelease. Disabling global synthetics and forcing the dexing
# transform to use the full classpath avoids the broken no-classpath transform.
android.enableGlobalSynthetics=false
android.useFullClasspathForDexingTransform=true

